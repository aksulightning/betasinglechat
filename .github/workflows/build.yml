name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish default-branch publishing before a newer run can replace its release.
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and check
        run: bash ./gradlew build

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: beta-single-chat
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Replace Build release
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download successful build
        uses: actions/download-artifact@v8
        with:
          name: beta-single-chat
          path: release-assets

      - name: Replace rolling Build release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_assets=(release-assets/*.jar)
          if (( ${#release_assets[@]} == 0 )); then
            echo "No JARs found; leaving the existing Build release unchanged." >&2
            exit 1
          fi

          # Complete both lookups before deleting anything; API failures stop here.
          existing_release=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "build") | .id')
          existing_tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/build" \
            --jq '.[] | select(.ref == "refs/tags/build") | .ref')

          if [[ -n "$existing_release" ]]; then
            gh release delete build --yes
          fi
          if [[ -n "$existing_tag" ]]; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/build"
          fi

          gh release create build "${release_assets[@]}" \
            --target "$BUILD_SHA" \
            --title "Build" \
            --prerelease \
            --latest=false \
            --generate-notes \
            --notes "Automatic build from commit $BUILD_SHA. Replaced after each successful default-branch build."
